name: Dolby metadata reader
on:
  push:
    branches: [main]
    paths: ['Tools/DolbyMetadataAudit/**', 'Tools/DolbyFrameReference/**', '.github/workflows/dolby-metadata.yml']
  pull_request:
    paths: ['Tools/DolbyMetadataAudit/**', 'Tools/DolbyFrameReference/**', '.github/workflows/dolby-metadata.yml']
permissions:
  contents: read
jobs:
  reader:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install development compiler and independent packet reference
        run: brew install rust ffmpeg
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          ffmpeg -version
          ffprobe -version
      - name: Format
        run: cargo fmt --manifest-path Tools/DolbyMetadataAudit/Cargo.toml --check
      - name: Generated and adversarial reader tests
        run: cargo test --locked --manifest-path Tools/DolbyMetadataAudit/Cargo.toml
      - name: Lint
        run: cargo clippy --locked --all-targets --manifest-path Tools/DolbyMetadataAudit/Cargo.toml -- -D warnings
      - name: Generated decoded-frame and raw-metadata association
        run: python3 Tools/DolbyFrameReference/test_reference.py -v
