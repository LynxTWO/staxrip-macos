name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Install development and encoding test tools
        run: brew install ffmpeg rust
      - name: Build read-only Dolby inspection helper
        run: cargo build --locked --release --manifest-path Tools/DolbyMetadataAudit/Cargo.toml
      - name: Prepare shared native development test fixtures
        run: ./scripts/prepare-native-test-fixtures.command
      - name: Build and test
        run: swift test
      - name: Build preview bundle and icon fallback
        run: ./build.command
