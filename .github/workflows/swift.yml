name: Swift checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Install encoding test tools
        run: brew install ffmpeg
      - name: Build and test
        run: swift test
      - name: D073 focused caption cancellation diagnosis
        if: always()
        run: swift test --filter cancellingSecondTrackVerifierSettlesBeforeCleanup
